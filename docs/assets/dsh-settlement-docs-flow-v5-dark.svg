<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-settlement-docs: a checklist CSV and an actual-submission CSV join on the document code; every checklist line runs a short-circuit adjudication ladder (submitted, copies, signed, stamped) with side doors for missing, optional_missing, copies_short, unsigned and unstamped; a completeness scoreboard reports 66.67% (8/12 required) and 4 blocking plus 1 info issue; settlement_export writes a 15-row UTF-8 BOM worksheet into the DSH_HOME exports directory">
